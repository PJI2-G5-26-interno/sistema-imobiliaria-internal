name: Migrações

on:
  push:
    branches:
      - develop
      - main
    paths:
      - supabase/migrations/**
      - .github/workflows/migracoes.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: migracao-supabase
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    environment: supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_YES: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Conferir segredos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Faltam os segredos SUPABASE_ACCESS_TOKEN e SUPABASE_DB_PASSWORD no environment supabase."
            exit 1
          fi

      - name: Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Vincular o projeto da aplicação
        run: supabase link --project-ref krpbozqmhojrciguubyd

      - name: Aplicar migrations pendentes
        run: supabase db push --linked
